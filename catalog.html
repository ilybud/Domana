grid.replaceChildren(...rows);document.querySelector('.empty-state').hidden=list.length>0;document.querySelector('#bag-count').textContent='('+window.shopCartCount()+')'}

(() => {
 const toggle=document.querySelector('#menu-toggle');
 const drawer=document.querySelector('#menu-drawer');
 const close=drawer.querySelector('.drawer-close');
 const mobileMenu=matchMedia('(max-width:760px)');
 mobileMenu.addEventListener('change',event=>{if(!event.matches&&drawer.open)closeMenu()});
 let closing=false;
 function closeMenu(target){
   if(!drawer.open || closing)return;
   closing=true;drawer.classList.remove('is-open');
   setTimeout(()=>{
     drawer.close();closing=false;document.documentElement.classList.remove('drawer-open');
     toggle.setAttribute('aria-expanded','false');
     if(target){const section=document.querySelector(target);if(section){section.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});section.setAttribute('tabindex','-1');section.focus({preventScroll:true})}}
     else toggle.focus();
   },matchMedia('(prefers-reduced-motion: reduce)').matches?0:350);
 }
 toggle.addEventListener('click',()=>{if(drawer.open)return;drawer.showModal();document.documentElement.classList.add('drawer-open');toggle.setAttribute('aria-expanded','true');requestAnimationFrame(()=>requestAnimationFrame(()=>drawer.classList.add('is-open')));close.focus()});
 close.addEventListener('click',()=>closeMenu());
 drawer.addEventListener('cancel',event=>{event.preventDefault();closeMenu()});
 drawer.addEventListener('click',event=>{if(event.target===drawer){const box=drawer.getBoundingClientRect();if(event.clientX>box.right||event.clientX<box.left)closeMenu()}});
 drawer.querySelectorAll('a').forEach(link=>link.addEventListener('click',event=>{const href=link.getAttribute('href');if(href.startsWith('#')){event.preventDefault();closeMenu(href)}}));
 document.querySelectorAll('[data-collection-link]').forEach(link=>link.addEventListener('click',()=>{state.query='';document.querySelector('#search-input').value='';choose('All')}));
})();
