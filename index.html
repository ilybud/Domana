<script>
(async function playCatalogIntro() {
  const root = document.documentElement;
  const overlay = document.querySelector('.intro-screen');
  if (!root.classList.contains('intro-active')) {
    overlay?.remove();
    return;
  }
  const content = document.querySelector('.catalog-content');
  const strokes = [...overlay.querySelectorAll('.ink-stroke')];
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  content.inert = true;
  try {
    if (reduced || !overlay.animate) {
      strokes.forEach(stroke => { stroke.style.opacity = '1'; });
      if (overlay.animate) await overlay.animate([{ opacity: 1 }, { opacity: 1 }], { duration: 350 }).finished;
    } else {
      const lengths = strokes.map(stroke => stroke.getTotalLength());
      const total = lengths.reduce((sum, length) => sum + length, 0);
      let delay = 0;
      await Promise.all(strokes.map((stroke, index) => {
        const length = lengths[index];
        const duration = 2600 * length / total;
        stroke.style.strokeDasharray = `${length} ${length}`;
        stroke.style.strokeDashoffset = `${length}`;
        stroke.style.opacity = '1';
        const animation = stroke.animate([
          { strokeDashoffset: length }, { strokeDashoffset: 0 }
        ], { duration, delay, easing: 'linear', fill: 'forwards' });
        delay += duration + 8;
        return animation.finished;
      }));
    }
    root.classList.add('intro-revealing');
    if (overlay.animate) await overlay.animate([
      { opacity: 1 }, { opacity: 0 }
    ], { duration: reduced ? 150 : 650, easing: 'ease-in-out', fill: 'forwards' }).finished;
  } catch (error) {
    console.warn('Signature intro skipped:', error);
  } finally {
    root.classList.remove('intro-active', 'intro-revealing');
    content.inert = false;
    overlay.remove();
  }
})();
</script>

(() => {
 const slides = [...document.querySelectorAll('.campaign-slide')];
 const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
 let current = 0, timer;
 function stop(){ clearInterval(timer); timer = undefined; }
 function start(){
   stop();
   if(document.hidden || reducedMotion.matches || document.documentElement.classList.contains('intro-active')) return;
   timer = setInterval(() => {
     slides[current].classList.remove('is-active');
     slides[current].setAttribute('aria-hidden','true');
     current = (current + 1) % slides.length;
     slides[current].classList.add('is-active');
     slides[current].setAttribute('aria-hidden','false');
   }, 4500);
 }
 const introObserver = new MutationObserver(() => {
   if(!document.documentElement.classList.contains('intro-active')){ introObserver.disconnect(); start(); }
 });
 if(document.documentElement.classList.contains('intro-active')) introObserver.observe(document.documentElement,{attributes:true,attributeFilter:['class']});
 else start();
 document.addEventListener('visibilitychange', start);
 reducedMotion.addEventListener('change', start);
 window.addEventListener('pagehide', stop);
 window.addEventListener('pageshow', start);
})();
